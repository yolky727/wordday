<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WORDDAY 3.3.1 · 传奇实装卡面</title><link rel="stylesheet" href="wildwords.css"><link rel="stylesheet" href="advanced285fix.css"><link rel="stylesheet" href="legend33.css"><style>:root{--paper:#fffefa;--ink:#293c33;--line:#dce1d9;--muted:#7a837c;--green:#426957}*{box-sizing:border-box}body{margin:0;background:#f5f4ee;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif}main{max-width:1180px;margin:auto;padding:40px 30px}header{border-bottom:1px solid var(--line);padding-bottom:22px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;font-size:23px}.kicker{font-size:10px;letter-spacing:2px;color:var(--muted)}h1{font-size:31px;margin:32px 0 10px}p{font-size:13px;color:var(--muted);line-height:1.8}.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:30px;padding:32px;background:#ffffff99;border:1px solid var(--line);border-radius:28px;margin:28px 0;backdrop-filter:blur(24px)}.shell{border:0;background:none;padding:0;width:100%;max-width:290px;aspect-ratio:3/4;position:relative;perspective:1000px;cursor:pointer;display:block;margin:auto}.rotor{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .8s}.back .rotor{transform:rotateY(180deg)}.side{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}.rear{transform:rotateY(180deg)}.side>.wild-card{width:100%;height:100%;min-height:0}.wild-card .wild-emoji{font-size:90px!important;line-height:1.5}.label{margin-top:22px;font-size:13px;display:flex;justify-content:space-between;gap:8px}.label small{font-size:10px;color:var(--muted)}button.tool{font:inherit;font-size:12px;color:var(--ink);border:1px solid var(--line);border-radius:12px;background:#fff9;padding:11px 15px;margin-right:8px;cursor:pointer}.paused *{animation-play-state:paused!important}.dark{background:#1f2d29;--ink:#edf1ea;--muted:#acb8b0;--paper:#2c3a33;--line:#526459}.dark .gallery{background:#33463d77}.dark button.tool{background:#34463a;color:#edf1ea}button:focus-visible{outline:3px solid var(--green);outline-offset:5px}@media(max-width:760px){main{padding:25px 20px}.gallery{grid-template-columns:1fr;padding:25px;gap:32px}.shell{max-width:290px}header{gap:20px}.kicker{font-size:9px}.wild-card .wild-emoji{font-size:90px!important}}@media(prefers-reduced-motion:reduce){.rotor{transition:none}}</style><link rel="stylesheet" href="patch331.css"></head><body><main><header><span class="brand">WORDDAY</span><span class="kicker">WILDWORDS / 3.3</span></header><h1>传奇，远古的回响。</h1><p>3.3 实装卡面 · 与应用共用同一套卡面与动态样式 · 点击卡牌翻面</p><button class="tool" id="flip">翻转全部</button><button class="tool" id="motion">暂停动效</button><button class="tool" id="theme">午夜背景</button><div class="gallery" id="gallery"></div><p>暗血红渐变流动 · 银色光泽流动 · 浅星空与深蓝流动<br>外框始终深于卡面；三张卡共用远古爪痕背面。</p></main><script>window.WILDWORDS={animals:[{"id": 136, "name": "Mammoth", "cn": "猛犸象", "emoji": "🦣", "rarity": 5}, {"id": 137, "name": "Brachiosaurus", "cn": "长颈龙", "emoji": "🦕", "rarity": 5}, {"id": 138, "name": "Tyrannosaurus", "cn": "霸王龙", "emoji": "🦖", "rarity": 5}],data:{},album(){}};</script><script src="legend33.js"></script><script>const names={Mammoth:'亘古 · 冰封',Brachiosaurus:'冥想',Tyrannosaurus:'暴君降临 · 远古号令'},cards=[...WILDWORDS.animals].sort((a,b)=>b.id-a.id);document.getElementById('gallery').innerHTML=cards.map(a=>'<article><button class="shell" aria-label="翻转'+a.cn+'卡面"><span class="rotor"><span class="side">'+WDLegendary.card(a)+'</span><span class="side rear">'+WDLegendary.card(a,false,'',true)+'</span></span></button><div class="label"><strong>'+a.cn+'</strong><small>'+names[a.name]+'</small></div></article>').join('');document.querySelectorAll('.shell').forEach(b=>b.onclick=()=>b.classList.toggle('back'));document.getElementById('flip').onclick=()=>{const b=[...document.querySelectorAll('.shell')],state=!b.every(b=>b.classList.contains('back'));b.forEach(b=>b.classList.toggle('back',state))};document.getElementById('motion').onclick=e=>{const p=document.body.classList.toggle('paused');e.currentTarget.textContent=p?'播放动效':'暂停动效'};document.getElementById('theme').onclick=e=>{const d=document.body.classList.toggle('dark');e.currentTarget.textContent=d?'米白背景':'午夜背景'};</script></body></html>
